<style>

body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Helvetica Neue",sans-serif;
background:#EEF2F7;color:#1F2937;padding:10px}
.wrap{max-width:1280px;margin:0 auto}
.hdr{margin-bottom:10px}
.brand{font-size:19px;font-weight:800;color:#1F4E79;letter-spacing:.3px}
.sub{font-size:11.5px;color:#8A94A6;margin-top:3px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;background:#fff;color:#6B7280;
font-size:14px;font-weight:700;cursor:pointer;border:1px solid #E3E8EF}
.tab.on{background:#1F4E79;color:#fff;border-color:#1F4E79}
.panel{display:none}
.panel.on{display:block}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:10px}
.card{background:#fff;border-radius:12px;padding:13px 13px 12px;box-shadow:0 1px 3px rgba(16,24,40,.07);
border-left:4px solid #4472C4}
.card.main{grid-column:span 2;border-left-color:#1F4E79;
background:linear-gradient(120deg,#1F4E79,#2E75B6);color:#fff}
.card.o{border-left-color:#E97132}
.card .k{font-size:12.5px;color:#7A8699;font-weight:700;letter-spacing:.3px}
.card.main .k{color:#D6E4F0}
.card .v{font-size:29px;font-weight:800;color:#1F4E79;line-height:1.15;margin-top:5px;
font-variant-numeric:tabular-nums}
.card.main .v{font-size:40px;color:#fff}
.card.o .v{color:#C55A11}
.card .u{font-size:13px;font-weight:700;color:#A8B0BD;margin-left:3px}
.card.main .u{color:#C9DCEC}
.card .s{font-size:11px;color:#A0A8B5;margin-top:5px}
.card.main .s{color:#BFD3E8}

.box{background:#fff;border-radius:12px;padding:12px 13px;margin-bottom:10px;
box-shadow:0 1px 3px rgba(16,24,40,.07)}
.box h3{font-size:13.5px;color:#374151;margin-bottom:8px;font-weight:800;
display:flex;justify-content:space-between;align-items:baseline}
.box h3 em{font-style:normal;font-size:11px;color:#A0A8B5;font-weight:400}

.sorts{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.sort{padding:5px 11px;border-radius:20px;background:#fff;color:#7A8699;font-size:12px;
font-weight:700;cursor:pointer;border:1px solid #E3E8EF}
.sort.on{background:#C55A11;color:#fff;border-color:#C55A11}

.whlist{display:grid;grid-template-columns:1fr;gap:9px}
.whcard{background:#fff;border-radius:12px;padding:12px 13px;box-shadow:0 1px 3px rgba(16,24,40,.07);
border-top:3px solid #E97132}
.wh-top{display:flex;justify-content:space-between;align-items:baseline}
.wh-name{font-size:15px;font-weight:800;color:#000}
.wh-ton{font-size:21px;font-weight:800;color:#C55A11;font-variant-numeric:tabular-nums}
.wh-ton em{font-style:normal;font-size:12px;color:#A0A8B5;margin-left:2px}
.bar{height:7px;background:#F1F3F6;border-radius:4px;overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#E97132,#F6B26B)}
.wh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wh-grid div{background:#FBF7F3;border-radius:8px;padding:7px 4px;text-align:center}
.wh-grid b{display:block;font-size:15px;font-weight:800;color:#374151;font-variant-numeric:tabular-nums}
.wh-grid span{display:block;font-size:10.5px;color:#9AA3B0;margin-top:2px}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}
.sumrow div{background:#fff;border-radius:12px;padding:11px;text-align:center;
box-shadow:0 1px 3px rgba(16,24,40,.07);border-bottom:3px solid #1F4E79}
.sumrow b{display:block;font-size:22px;font-weight:800;color:#1F4E79;font-variant-numeric:tabular-nums}
.sumrow span{display:block;font-size:11px;color:#8A94A6;margin-top:2px}

/* 城市仓详情（点卡片弹出） */
.whcard{cursor:pointer;position:relative;padding-bottom:24px;transition:transform .12s}
.whcard:active{transform:scale(.985)}
.wh-more{position:absolute;right:13px;bottom:7px;font-size:11px;color:#C55A11;font-weight:700}
.wh-more:after{content:" ›"}
.wh-chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
vertical-align:middle;margin-left:5px;line-height:1.4}
.wh-chip.closed{background:#F1F3F4;color:#9AA0A6}
.wh-closed{opacity:.55;background:#F7F8FA!important;border-color:#E4E7EC!important}
.wh-closed .wh-ton{color:#9AA0A6}
.wh-closed-note{font-size:11px;color:#9AA0A6;background:#F1F3F4;padding:5px 9px;border-radius:6px;

.mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#EEF2F7;

.sheet.on{transform:translateY(0)}
.sh-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.sh-t{font-size:17px;font-weight:800;color:#1F4E79;line-height:1.25}
.sh-s{font-size:11px;color:#8A94A6;margin-top:3px}
.sh-x{width:28px;height:28px;border-radius:50%;background:#fff;color:#7A8699;font-size:18px;
display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #E3E8EF;
flex:none;line-height:1}
.sh-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.sh-kpi div{background:#fff;border-radius:10px;padding:9px 3px;text-align:center;

.no-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:#6B7280;line-height:1.7}
.no-legend em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.rank{list-style:none}
.rank li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #EDF0F4}
.rank li:last-child{border-bottom:none}
.rk{width:18px;height:18px;border-radius:5px;background:#F1F3F6;color:#8A94A6;font-size:10.5px;
font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.rank li:nth-child(1) .rk{background:#E97132;color:#fff}
.rank li:nth-child(2) .rk{background:#F0A868;color:#fff}
.rank li:nth-child(3) .rk{background:#F7C797;color:#8A4B12}
.rn{flex:1;font-size:12.5px;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{font-size:12.5px;font-weight:800;color:#C55A11;font-variant-numeric:tabular-nums;flex:none}

.sortbar{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sortbar .lb{font-size:12px;font-weight:800;color:#6B7280;flex:none}
.sortbar .hint{font-size:11px;color:#A0A8B5;flex:none}
.sortbar .sorts{flex:1;margin-bottom:0;justify-content:flex-end}

@media(min-width:700px){

  .whlist{grid-template-columns:repeat(2,1fr)}

  .whlist{grid-template-columns:repeat(3,1fr)}

<script>
const D = window.__DATA__;
const fmt = (n, d=2) => Number(n).toLocaleString('zh-CN', {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function sparkline(el, data, key, color, unit){
  const w = el.clientWidth || 400, h = 168, pad = {l:38, r:10, t:10, b:22};
  const max = Math.max(...data.map(d=>d[key])) * 1.12 || 1;
  const x = i => pad.l + i * (w - pad.l - pad.r) / Math.max(data.length-1, 1);
  const y = v => h - pad.b - (v / max) * (h - pad.t - pad.b);
  let g = '';
  for(let i=0;i<=3;i++){
    const v = max*i/3, yy = y(v);
    g += `<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#EEF1F5"/>`;
    g += `<text x="${pad.l-5}" y="${yy+4}" font-size="9.5" fill="#A0A8B5" text-anchor="end">${v.toFixed(v<10?1:0)}</text>`;
  }
  let path = '', dots = '';
  data.forEach((d,i)=>{
    path += (i?'L':'M') + x(i) + ',' + y(d[key]);
    dots += `<circle cx="${x(i)}" cy="${y(d[key])}" r="3" fill="${color}">
      <title>${d.day}  ${d[key].toFixed(2)}${unit}</title></circle>`;
  });
  const area = path + `L${x(data.length-1)},${h-pad.b}L${x(0)},${h-pad.b}Z`;
  const step = Math.ceil(data.length / 6);
  let labels = '';
  data.forEach((d,i)=>{ if(i%step===0 || i===data.length-1)
    labels += `<text x="${x(i)}" y="${h-6}" font-size="9.5" fill="#A0A8B5" text-anchor="middle">${d.day}</text>`; });
  el.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
    ${g}<path d="${area}" fill="${color}" opacity="0.10"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

function bars(el, data, key, color, unit){
  const w = el.clientWidth || 400, h = 168, pad = {l:34, r:10, t:10, b:22};
  const max = Math.max(...data.map(d=>d[key])) * 1.12 || 1;
  const bw = (w - pad.l - pad.r) / data.length;
  let s = '';
  for(let i=0;i<=3;i++){
    const v = max*i/3, yy = h - pad.b - (v/max)*(h-pad.t-pad.b);
    s += `<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#EEF1F5"/>`;
    s += `<text x="${pad.l-5}" y="${yy+4}" font-size="9.5" fill="#A0A8B5" text-anchor="end">${Math.round(v)}</text>`;
  }
  const step = Math.ceil(data.length / 6);
  data.forEach((d,i)=>{
    const bh = (d[key]/max)*(h-pad.t-pad.b);
    s += `<rect x="${pad.l+i*bw+0.8}" y="${h-pad.b-bh}" width="${Math.max(bw-1.6,1)}" height="${bh}"
      fill="${color}" rx="1.5"><title>${d.day}  ${d[key]}${unit}</title></rect>`;
    if(i%step===0 || i===data.length-1)
      s += `<text x="${pad.l+i*bw+bw/2}" y="${h-6}" font-size="9.5" fill="#A0A8B5" text-anchor="middle">${d.day}</text>`;
  });
  el.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}

function renderTotal(){
  const t = D.total;
  // 总看板统计「全部数据」口径：月活 / 转化 / 复购都按全部仓算，
  // 关仓仓的历史数据一并计入；经营仓数单独作为一项展示
  const cards = [
    ['月累计吨位', fmt(t.ton), '吨', `日均 ${fmt(t.avg_day_ton)} 吨 · ${t.days}个供货日`, 'main'],
    ['新开客户', t.new_cust, '户', `首单在本月`, ''],
    ['月活客户', t.month_active, '户', `本月下过单`, ''],
    ['首单转化率', (t.first_conv*100).toFixed(1), '%', `下单${t.reg_and_order} · 注册${t.new_member}`, 'o'],
    ['3日复购率', (t.r3.rate*100).toFixed(1), '%', `复购${t.r3.repeat} · 下单${t.r3.base}`, 'o'],
  ];
  document.getElementById('cards').innerHTML = cards.map(c=>
    `<div class="card ${c[4]}"><div class="k">${c[0]}</div>
     <div class="v">${c[1]}<span class="u">${c[2]}</span></div><div class="s">${c[3]}</div></div>`).join('');
  sparkline(document.getElementById('chartTon'), D.daily, 'ton', '#4472C4', ' 吨');
  bars(document.getElementById('chartNew'), D.new_daily, 'n', '#E97132', ' 户');
}

function renderWh(){
  const rows = D.wh.slice();
  const t = D.total;
  const maxTon = Math.max(...rows.map(r=>r.month_ton));
  document.getElementById('sumRow').innerHTML = [
    [fmt(t.ton), `月累计吨位 · ${t.days}天`],
    [t.month_active, '月活客户'],
    [`${t.wh_active_n}`, `经营仓数`],
  ].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');

  const draw = (key) => {
    const sorted = rows.slice().sort((a,b)=> b[key] - a[key]);
    document.getElementById('whList').innerHTML = sorted.map(w=>{
      const closed = (w.status === 'closed');
      // 只给已关仓加标识，在营仓是常态不再标「在营」
      const chip = closed
        ? `<span class="wh-chip closed" title="近 3 个已结束供货日无吨位">已关仓</span>`
        : '';
      return `<div class="whcard ${closed?'wh-closed':''}" data-wh="${esc(w.wh)}">
        <div class="wh-top">
          <span class="wh-name">${esc(w.wh)} ${chip}</span>
          <span class="wh-ton">${fmt(w.month_ton)}<em>吨</em></span>
        </div>
        <div class="bar"><i style="width:${(w.month_ton/maxTon*100).toFixed(1)}%"></i></div>
        <div class="wh-grid">
          <div><b>${fmt(w.day_ton)}</b><span>今日吨位</span></div>
          <div><b>${fmt(w.avg_ton)}</b><span>日均吨位</span></div>
          <div><b>${w.active}</b><span>月活</span></div>
          <div><b>${fmt(w.per_order_ton,3)}</b><span>客单(吨)</span></div>
        </div>
        <div class="wh-grid" style="margin-top:6px">
          <div><b>${w.r3_rate==null ? '—' : (w.r3_rate*100).toFixed(1)+'%'}</b><span>3日复购</span></div>
          <div><b>${w.r3_rate==null ? '—' : w.r3_repeat+'/'+w.r3_base}</b><span>复购／下单</span></div>
          <div><b>${fmt(w.per_cust_ton,3)}</b><span>人均(吨)</span></div>
          <div><b>${w.qty}</b><span>件数</span></div>
        </div>
        ${closed ? `<div class="wh-closed-note">历史仓 · 月累计 ${fmt(w.month_ton)} 吨已保留</div>` : ''}
        <div class="wh-more">详情</div>
      </div>`;}).join('');
    document.querySelectorAll('.whcard').forEach(c=>{
      c.onclick = ()=> openDetail(c.dataset.wh);
    });
  };
  draw('month_ton');
  document.querySelectorAll('.sort').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('.sort').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      draw(b.dataset.k);
    };
  });
}

function openDetail(name){
  const w = D.wh.find(x => x.wh === name);
  if(!w) return;
  const t = D.total, d = w.detail;
  const totC = d.new_n + d.old_n;
  const totT = d.new_ton + d.old_ton;
  const np = totC ? d.new_n / totC * 100 : 0;
  const nt = totT ? d.new_ton / totT * 100 : 0;
  document.getElementById('shT').textContent = w.wh + (w.status === 'closed' ? ' · 已关仓' : '');
  document.getElementById('shS').textContent =
    `月累计 ${fmt(w.month_ton)} 吨 · 月活 ${w.active} 户 · 件数 ${w.qty} 件` +
    (w.status === 'closed' ? ` · 近 3 个供货日合计 ${fmt(w.recent3_ton,3)} 吨` : '');
  document.getElementById('shKpi').innerHTML = [
    [fmt(w.month_ton), '月累计吨位'], [fmt(w.avg_ton), '日均吨位'],
    [fmt(w.per_order_ton,3), '客单(吨)'], [w.r3_rate==null ? '不参与' : (w.r3_rate*100).toFixed(1)+'%', '3日复购'],
  ].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
  document.getElementById('shNewOld').innerHTML = `
    <div class="newold">
      <i style="width:${np.toFixed(1)}%;background:#E97132">${d.new_n ? d.new_n+' 新客' : ''}</i>
      <i style="width:${(100-np).toFixed(1)}%;background:#4472C4">${d.old_n ? d.old_n+' 老客' : ''}</i>
    </div>
    <div class="no-legend">
      <span><em style="background:#E97132"></em>新客 ${d.new_n} 户 · ${fmt(d.new_ton)} 吨（占 ${np.toFixed(0)}%）</span>
      <span><em style="background:#4472C4"></em>老客 ${d.old_n} 户 · ${fmt(d.old_ton)} 吨（占 ${(100-np).toFixed(0)}%）</span>
    </div>`;
  const rank = (arr, valFn, unit) => arr.length
    ? `<ul class="rank">` + arr.map((x,i)=>
        `<li><span class="rk">${i+1}</span><span class="rn">${esc(x.name)}</span>
         <span class="rv">${valFn(x)}${unit}</span></li>`).join('') + `</ul>`
    : `<div class="sh-empty">暂无数据</div>`;
  document.getElementById('shCust').innerHTML = rank(d.top_cust, x=>fmt(x.ton), ' 吨');
  // TOP 商品按「下过该商品的客户数」排序展示
  document.getElementById('shItem').innerHTML = rank(d.top_item, x=>x.cust, ' 户');
  document.getElementById('shCat').innerHTML  = rank(d.top_cat,  x=>fmt(x.ton), ' 吨');
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  // 等弹层动画开始、容器有宽度后再画折线
  setTimeout(()=> sparkline(document.getElementById('shChart'), d.series, 'ton', '#C55A11', ' 吨'), 60);
}

function closeDetail(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('mask').classList.remove('on');
}

window.onload = ()=>{
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById(t.dataset.p).classList.add('on');
  });
  renderTotal(); renderWh();
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(renderTotal,200); });
};
</script>
</body></html>
